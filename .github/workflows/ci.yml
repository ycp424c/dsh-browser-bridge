name: ci

on:
  push:
  pull_request:

env:
  # Runtime and client-engine test source must match the supported DSH release.
  DSH_VERSION: 0.2.1-rc.2
  DSH_SOURCE_REPO: https://github.com/deepseek-ai/deepseek-harness.git
  DSH_SOURCE_REVISION: 687f282e8625c6b8d11ff58211a90524be2e4317
  # Keep Playwright browsers inside the workspace (gitignored).
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19
          cache: pnpm

      - name: Check out the pinned DSH source
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.ci"
          git clone --filter=blob:none --no-checkout "$DSH_SOURCE_REPO" "$GITHUB_WORKSPACE/.ci/dsh"
          git -C "$GITHUB_WORKSPACE/.ci/dsh" checkout "$DSH_SOURCE_REVISION"

      - name: Install the pinned DSH SDK
        run: |
          npm install --prefix "$GITHUB_WORKSPACE/.ci/sdk" --legacy-peer-deps --ignore-scripts "@deepseek-ai/dsh@$DSH_VERSION"
          npm install --prefix "$GITHUB_WORKSPACE/.ci/extra-sdk" --legacy-peer-deps --ignore-scripts "@deepseek-ai/dsh-client-store@$DSH_VERSION" "@deepseek-ai/dsh-client-ui-slots@$DSH_VERSION" "@deepseek-ai/dsh-client-ui-primitives@$DSH_VERSION" zustand@5 immer@10

      - name: Configure the DSH SDK
        run: node scripts/setup-dsh.mjs "$GITHUB_WORKSPACE/.ci/sdk" "$GITHUB_WORKSPACE/.ci/dsh" "$GITHUB_WORKSPACE/.ci/extra-sdk"

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: Build, typecheck, and unit tests
        run: pnpm check

      - name: Package dry-runs
        run: |
          pnpm --filter @ycp424c/dsh-browser-bridge pack --dry-run
          pnpm --filter @ycp424c/dsh-browser-bridge-protocol pack --dry-run

      - name: Extension zip
        run: pnpm --filter @ycp424c/dsh-browser-bridge-extension zip

      - name: Install Chromium (full binary, repo-local cache)
        run: pnpm exec playwright install chromium

      - name: Headed extension tests under Xvfb
        run: xvfb-run -a env HEADED=1 pnpm exec playwright test e2e/extension.spec.ts
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers

      - name: Upload extension artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-mv3
          path: extension/output/chrome-mv3

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
